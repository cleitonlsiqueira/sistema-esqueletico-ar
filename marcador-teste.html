<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marcador de teste — Sistema Esquelético</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #eee;
    }
    .wrap { text-align: center; padding: 24px; }
    img {
      width: min(78vw, 520px);
      height: auto;
      box-shadow: 0 8px 30px rgba(0,0,0,.18);
    }
    p { max-width: 620px; line-height: 1.45; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Marcador de teste</h1>
    <p>Abra esta página em um computador ou tablet. Depois, no celular, abra a experiência AR e aponte a câmera para a imagem abaixo.</p>
    <img
      src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.png"
      alt="Marcador de teste do MindAR">
  </div>
</body>
</html>
