<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sistema Esquelético — AR</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0; width: 100%; height: 100%; overflow: hidden;
      font-family: Arial, sans-serif; background: transparent;
    }

    #landing {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(180deg, #111, #1f1f1f);
      color: #fff; padding: 24px; box-sizing: border-box;
    }

    .card {
      width: min(92vw, 520px);
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 22px;
      padding: 24px;
      text-align: center;
      box-sizing: border-box;
    }

    h1 { margin: 0 0 10px; font-size: 28px; }
    p { line-height: 1.45; opacity: .92; }

    .browser-note {
      margin: 18px 0 4px;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.12);
      font-size: 14px;
      line-height: 1.4;
    }

    .browser-note strong {
      font-weight: 700;
    }

    button {
      margin-top: 14px; width: 100%; border: 0; border-radius: 14px;
      padding: 15px 18px; font-size: 17px; font-weight: 700; cursor: pointer;
    }

    #status {
      margin-top: 14px; font-size: 14px; min-height: 42px; opacity: .9;
    }

    #topbar {
      position: fixed; top: max(12px, env(safe-area-inset-top)); left: 50%;
      transform: translateX(-50%); z-index: 9000; display: none;
      width: min(92vw, 560px);
      background: rgba(0,0,0,.67); color: white;
      border-radius: 15px; padding: 10px 14px; box-sizing: border-box;
      text-align: center; pointer-events: none; backdrop-filter: blur(8px);
    }

    #topTitle { font-weight: 800; font-size: 18px; }
    #topStatus { margin-top: 4px; font-size: 13px; }

    a-scene {
      position: fixed !important; inset: 0 !important;
      width: 100% !important; height: 100% !important;
      background: transparent !important;
    }

    .a-canvas {
      background: transparent !important;
    }

    #mindar-video {
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
    }
  </style>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const sceneEl = document.querySelector("a-scene");
      const startBtn = document.querySelector("#startBtn");
      const status = document.querySelector("#status");
      const landing = document.querySelector("#landing");
      const topbar = document.querySelector("#topbar");
      const topStatus = document.querySelector("#topStatus");
      const target = document.querySelector("#target");
      const model = document.querySelector("#skeletonModel");

      let arSystem = null;
      let sceneReady = false;

      sceneEl.addEventListener("loaded", function () {
        arSystem = sceneEl.systems["mindar-image-system"];
        sceneReady = true;
        status.textContent = "";
        status.style.display = "none";
        startBtn.disabled = false;
        startBtn.textContent = "INICIAR CÂMERA";
      });

      sceneEl.addEventListener("arReady", function () {
        landing.style.display = "none";
        topbar.style.display = "block";
        topStatus.textContent = "Aponte a câmera para o painel.";
      });

      sceneEl.addEventListener("arError", function () {
        status.style.display = "block";
        status.textContent = "Não foi possível iniciar a câmera. Verifique a permissão do navegador e tente novamente.";
        startBtn.disabled = false;
        startBtn.textContent = "TENTAR NOVAMENTE";
      });

      target.addEventListener("targetFound", function () {
        topStatus.textContent = "Painel reconhecido — CALIBRAÇÃO V5.8";

        // V5.3: sem animação. O modelo fica preso ao plano do painel
        // para permitir ajustar tamanho e posição com precisão.
        model.removeAttribute("animation__lift");
        model.removeAttribute("animation__grow");
        model.removeAttribute("animation__turn");

        model.setAttribute("position", "0.035 0.20 0.01");
        model.setAttribute("rotation", "0 0 0");
        model.setAttribute("scale", "0.029 0.029 0.029");
        model.setAttribute("visible", true);
      });

      target.addEventListener("targetLost", function () {
        topStatus.textContent = "Aponte novamente para o painel.";
        model.removeAttribute("animation__lift");
        model.removeAttribute("animation__grow");
        model.removeAttribute("animation__turn");
        model.setAttribute("visible", false);
      });

      startBtn.addEventListener("click", async function () {
        if (!sceneReady || !arSystem) {
          status.style.display = "block";
          status.textContent = "Aguarde alguns segundos: o sistema ainda está carregando.";
          return;
        }

        startBtn.disabled = true;
        startBtn.textContent = "ABRINDO CÂMERA...";
        status.style.display = "block";
        status.textContent = "Permita o acesso à câmera para continuar.";

        try {
          await arSystem.start();
        } catch (err) {
          console.error(err);
          status.style.display = "block";
          status.textContent = "Erro ao iniciar a câmera: " + (err?.message || "erro desconhecido");
          startBtn.disabled = false;
          startBtn.textContent = "TENTAR NOVAMENTE";
        }
      });
    });
  </script>
</head>

<body>
  <div id="landing">
    <div class="card">
      <h1>SISTEMA ESQUELÉTICO — 3D</h1>
      <p>Toque no botão abaixo e aponte a câmera para o painel.</p>

      <div class="browser-note">
        📱 <strong>Melhor experiência:</strong>
        Safari no iPhone ou Google Chrome no Android.
      </div>

      <button id="startBtn" disabled>CARREGANDO...</button>
      <div id="status">Preparando o sistema...</div>
    </div>
  </div>

  <div id="topbar">
    <div id="topTitle">SISTEMA ESQUELÉTICO — 3D</div>
    <div id="topStatus">Aponte a câmera para o painel.</div>
  </div>

  <a-scene
    mindar-image="imageTargetSrc: ./assets/painel-sistema-esqueletico.mind; autoStart: false;"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true; alpha: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded>

    <a-assets timeout="15000">
      <a-asset-item id="skeletonAsset" src="./assets/esqueleto_branco_webAR.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity light="type: ambient; intensity: 1.2"></a-entity>
    <a-entity light="type: directional; intensity: 1.25" position="-1 2 2"></a-entity>

    <a-entity id="target" mindar-image-target="targetIndex: 0">
      <a-gltf-model
        id="skeletonModel"
        src="#skeletonAsset"
        visible="false"
        position="0.035 0.20 0.01"
        rotation="0 0 0"
        scale="0.029 0.029 0.029">
      </a-gltf-model>
    </a-entity>
  </a-scene>
</body>
</html>
