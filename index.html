<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sistema Esquelético — AR</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; font-family: Arial, sans-serif; background: #000; }
    .ui {
      position: fixed;
      z-index: 20;
      inset: 0;
      pointer-events: none;
    }
    .top {
      position: absolute;
      top: max(14px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      width: min(92vw, 520px);
      background: rgba(0,0,0,.68);
      color: white;
      border-radius: 16px;
      padding: 12px 16px;
      text-align: center;
      box-sizing: border-box;
      backdrop-filter: blur(8px);
    }
    .title { font-weight: 800; font-size: 20px; letter-spacing: .4px; }
    .status { font-size: 14px; opacity: .92; margin-top: 5px; line-height: 1.3; }
    .badge {
      display: inline-block;
      margin-top: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.16);
      font-size: 12px;
    }
  </style>

  <script>
    AFRAME.registerComponent('skeleton-behavior', {
      init: function () {
        const target = this.el;
        const model = document.querySelector('#skeletonModel');
        const status = document.querySelector('#status');

        target.addEventListener('targetFound', () => {
          status.textContent = 'Esqueleto reconhecido! Mova o celular devagar para perceber o efeito 3D.';
          model.setAttribute('visible', true);
          model.removeAttribute('animation__rise');
          model.removeAttribute('animation__scale');
          model.setAttribute('position', '0 -0.08 0.03');
          model.setAttribute('scale', '0.006 0.006 0.006');

          setTimeout(() => {
            model.setAttribute('animation__rise',
              'property: position; to: 0 -0.08 0.18; dur: 1200; easing: easeOutCubic');
            model.setAttribute('animation__scale',
              'property: scale; to: 0.012 0.012 0.012; dur: 1200; easing: easeOutCubic');
          }, 80);
        });

        target.addEventListener('targetLost', () => {
          status.textContent = 'Aponte a câmera para o marcador de teste.';
          model.setAttribute('visible', false);
        });
      }
    });
  </script>
</head>

<body>
  <div class="ui">
    <div class="top">
      <div class="title">SISTEMA ESQUELÉTICO — 3D</div>
      <div class="status" id="status">Aponte a câmera para o marcador de teste.</div>
      <div class="badge">Protótipo — o marcador será trocado pelo painel final</div>
    </div>
  </div>

  <a-scene
    mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.mind; autoStart: true; uiScanning: yes; uiLoading: yes;"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded>

    <a-assets timeout="15000">
      <a-asset-item id="skeletonAsset" src="./assets/esqueleto_branco_webAR.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Luzes suaves para preservar os detalhes do modelo branco -->
    <a-entity light="type: ambient; intensity: 1.35"></a-entity>
    <a-entity light="type: directional; intensity: 1.35" position="-1 2 2"></a-entity>
    <a-entity light="type: directional; intensity: 0.55" position="1 -1 1"></a-entity>

    <!-- Marcador provisório. No projeto final ele será substituído pelo painel real. -->
    <a-entity id="target" mindar-image-target="targetIndex: 0" skeleton-behavior>
      <a-gltf-model
        id="skeletonModel"
        src="#skeletonAsset"
        visible="false"
        rotation="0 0 0"
        position="0 -0.08 0.03"
        scale="0.006 0.006 0.006">
      </a-gltf-model>
    </a-entity>
  </a-scene>
</body>
</html>
