<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sistema Esquelético — AR</title>

  <!-- Versões alinhadas com os exemplos oficiais do MindAR -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #111;
    }

    #landing {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #111, #1f1f1f);
      color: #fff;
      padding: 24px;
      box-sizing: border-box;
    }

    .card {
      width: min(92vw, 520px);
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 22px;
      padding: 24px;
      text-align: center;
      box-sizing: border-box;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 28px;
    }

    p {
      line-height: 1.45;
      opacity: .92;
    }

    button {
      margin-top: 12px;
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 15px 18px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    #status {
      margin-top: 14px;
      font-size: 14px;
      min-height: 42px;
      opacity: .9;
    }

    #topbar {
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 9000;
      display: none;
      width: min(92vw, 560px);
      background: rgba(0,0,0,.67);
      color: white;
      border-radius: 15px;
      padding: 10px 14px;
      box-sizing: border-box;
      text-align: center;
      pointer-events: none;
      backdrop-filter: blur(8px);
    }

    #topTitle {
      font-weight: 800;
      font-size: 18px;
    }

    #topStatus {
      margin-top: 4px;
      font-size: 13px;
    }

    a-scene {
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
    }
  </style>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const sceneEl = document.querySelector("a-scene");
      const startBtn = document.querySelector("#startBtn");
      const status = document.querySelector("#status");
      const landing = document.querySelector("#landing");
      const topbar = document.querySelector("#topbar");
      const topStatus = document.querySelector("#topStatus");
      const target = document.querySelector("#target");
      const model = document.querySelector("#skeletonModel");

      let arSystem = null;
      let sceneReady = false;

      sceneEl.addEventListener("loaded", function () {
        arSystem = sceneEl.systems["mindar-image-system"];
        sceneReady = true;
        status.textContent = "Sistema carregado. Toque em “INICIAR CÂMERA”.";
        startBtn.disabled = false;
      });

      sceneEl.addEventListener("arReady", function () {
        landing.style.display = "none";
        topbar.style.display = "block";
        topStatus.textContent = "Aponte a câmera para o marcador de teste.";
      });

      sceneEl.addEventListener("arError", function () {
        status.textContent = "Não foi possível iniciar a câmera. Verifique a permissão do navegador e tente novamente.";
        startBtn.disabled = false;
        startBtn.textContent = "TENTAR NOVAMENTE";
      });

      target.addEventListener("targetFound", function () {
        topStatus.textContent = "Marcador reconhecido — mova o celular devagar.";
        model.setAttribute("visible", true);
      });

      target.addEventListener("targetLost", function () {
        topStatus.textContent = "Marcador perdido. Aponte novamente para a imagem.";
        model.setAttribute("visible", false);
      });

      startBtn.addEventListener("click", async function () {
        if (!sceneReady || !arSystem) {
          status.textContent = "Aguarde alguns segundos: o sistema ainda está carregando.";
          return;
        }

        startBtn.disabled = true;
        startBtn.textContent = "ABRINDO CÂMERA...";
        status.textContent = "O navegador poderá pedir autorização para usar a câmera.";

        try {
          await arSystem.start();
        } catch (err) {
          console.error(err);
          status.textContent = "Erro ao iniciar a câmera: " + (err?.message || "erro desconhecido");
          startBtn.disabled = false;
          startBtn.textContent = "TENTAR NOVAMENTE";
        }
      });
    });
  </script>
</head>

<body>
  <div id="landing">
    <div class="card">
      <h1>SISTEMA ESQUELÉTICO — 3D</h1>
      <p>Experiência de realidade aumentada.</p>
      <p>Toque no botão abaixo, permita o acesso à câmera e depois aponte o celular para o marcador de teste.</p>
      <button id="startBtn" disabled>CARREGANDO...</button>
      <div id="status">Preparando o sistema...</div>
    </div>
  </div>

  <div id="topbar">
    <div id="topTitle">SISTEMA ESQUELÉTICO — 3D</div>
    <div id="topStatus">Aponte a câmera para o marcador.</div>
  </div>

  <a-scene
    mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.mind; autoStart: false;"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded>

    <a-assets timeout="15000">
      <a-asset-item id="skeletonAsset" src="./assets/esqueleto_branco_webAR.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity light="type: ambient; intensity: 1.2"></a-entity>
    <a-entity light="type: directional; intensity: 1.25" position="-1 2 2"></a-entity>

    <a-entity id="target" mindar-image-target="targetIndex: 0">
      <a-gltf-model
        id="skeletonModel"
        src="#skeletonAsset"
        visible="false"
        position="0 -0.1 0.1"
        rotation="0 0 0"
        scale="0.01 0.01 0.01">
      </a-gltf-model>
    </a-entity>
  </a-scene>
</body>
</html>
