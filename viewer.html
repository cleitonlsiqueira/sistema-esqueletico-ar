<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Visualizador 3D — Sistema Esquelético</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    html, body { margin:0; height:100%; font-family:Arial,sans-serif; }
    model-viewer { width:100%; height:100%; background:#8a6a4c; }
    .label {
      position:fixed; z-index:10; left:50%; top:16px; transform:translateX(-50%);
      background:rgba(0,0,0,.65); color:#fff; padding:10px 14px; border-radius:12px;
      text-align:center;
    }
  </style>
</head>
<body>
  <div class="label">SISTEMA ESQUELÉTICO — visualizador 3D</div>
  <model-viewer
    src="./assets/esqueleto_branco_webAR.glb"
    camera-controls
    auto-rotate
    shadow-intensity="1"
    exposure="1"
    environment-image="neutral"
    interaction-prompt="auto">
  </model-viewer>
</body>
</html>
